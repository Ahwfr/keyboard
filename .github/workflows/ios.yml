name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native iOS project
        working-directory: ios_keyboard
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' Keyboard.xcodeproj/project.pbxproj

      - name: Archive host app and keyboard extension
        run: |
          set +e
          xcodebuild archive \
            -project ios_keyboard/Keyboard.xcodeproj \
            -scheme KeyboardHost \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Keyboard.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee xcodebuild.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            grep -E '(^| )((fatal )?error:|.*\.swift:[0-9]+:[0-9]+:)' xcodebuild.log \
              | tail -20 \
              | while IFS= read -r line; do
                  echo "::error title=Xcode archive failed::$line"
                done
            exit "$build_status"
          fi

      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned IPA artifact
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R "$RUNNER_TEMP/Keyboard.xcarchive/Products/Applications/KeyboardHost.app" Payload/Keyboard.app
          ditto -c -k --sequesterRsrc --keepParent Payload keyboard-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-unsigned-ipa
          path: keyboard-unsigned.ipa
