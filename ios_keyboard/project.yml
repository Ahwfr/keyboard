name: Keyboard
options:
  bundleIdPrefix: com.ahwfr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
packages:
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit.git
    from: 10.7.3
targets:
  KeyboardHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahwfr.keyboard
        INFOPLIST_FILE: Host/Info.plist
        CODE_SIGN_ENTITLEMENTS: Host/KeyboardHost.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      # KeyboardKit is linked and embedded by the container app. The extension
      # loads the same binary through its extension runpath.
      - package: KeyboardKit
        product: KeyboardKit
      - target: KeyboardExtension
        embed: true
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahwfr.keyboard.extension
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/KeyboardExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
    dependencies:
      # app-extension targets don't embed by default, so this links against
      # the copy the host app embeds instead of duplicating the framework.
      - package: KeyboardKit
        product: KeyboardKit
